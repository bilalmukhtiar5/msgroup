<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#a9142b" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Primary SEO -->
    <title>MS Group | Events, Brand Activation & Experiential Solutions</title>

    <meta
      name="description"
      content="MS Group provides complete events, brand activation, promotional staffing and experiential solutions for businesses and organizations in Pakistan."
    />

    <meta
      name="keywords"
      content="MS Group, events management Pakistan, event management, brand activation Pakistan, promotional staffing, experiential marketing, corporate events, event solutions"
    />

    <meta name="author" content="MS Group" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://www.msgroup.pk/"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="MS Group | Events, Brand Activation & Experiential Solutions"
    />

    <meta
      property="og:description"
      content="Complete events, brand activation, promotional staffing and experiential solutions by MS Group."
    />

    <meta
      property="og:url"
      content="https://www.msgroup.pk/"
    />

    <meta
      property="og:site_name"
      content="MS Group"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="MS Group | Events, Brand Activation & Experiential Solutions"
    />

    <meta
      name="twitter:description"
      content="Complete events, brand activation, promotional staffing and experiential solutions by MS Group."
    />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              msred: "#A9142B",
              msredDark: "#780F20",
              ink: "#171717"
            },
            boxShadow: {
              soft: "0 18px 50px rgba(0,0,0,.10)"
            }
          }
        }
      };
    </script>
  </head>

  <body class="bg-white text-ink antialiased">
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
